name: Bygg og Deploy vis-stilling
on:
    push:
    workflow_dispatch:

jobs:
    build-and-deploy:
        name: 🤖
        uses: navikt/toi-frontend-workflows/.github/workflows/build-and-deploy-nextjs.yaml@v4
        with:
            cdn-upload: true
            baseimage: europe-north1-docker.pkg.dev/cgr-nav/pull-through/nav.no/node:26
            playwright-command: pnpm run test --max-failures=4
            playwright-github-report: true
            playwright-shards: 4
            deploy-dev-branch: 'vis-stilling-modia'
            dev-vars-path: '.nais/dev-gcp.json'
            prod-vars-path: '.nais/prod-gcp.json'
        secrets: inherit
        permissions:
            actions: write
            contents: write
            id-token: write
            pages: write
